<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnergyCharts · Visual Analytics</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="elm"></div>
    <script src="elm.js"></script>
    <script>
        var app = Elm.Main.init({ node: document.getElementById("elm"), flags: Date.now() });


        if (app.ports && app.ports.onScroll) {
            var ticking = false;
            window.addEventListener("scroll", function () {
                if (!ticking) {
                    window.requestAnimationFrame(function () {
                        app.ports.onScroll.send(window.scrollY || window.pageYOffset || 0);
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        }
    </script>
</body>

</html>
